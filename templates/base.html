<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ゲーム制作とプログラミングの学習記録"
    >

    <title>
        {% block title %}
            {{ config.title }}
        {% endblock title %}
    </title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="site-title" href="/">
                {{ config.title }}
            </a>

            <nav class="site-nav">
                <a href="/">Home</a>
                <a href="/about/">About</a>
                <a href="/projects/">Projects</a>
                <a href="/learning/">Learning</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        {% block content %}
        {% endblock content %}
    </main>

    <footer class="site-footer">
        <p>
            © 2026 ひなの
        </p>
    </footer>
</body>
</html>
